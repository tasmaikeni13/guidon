[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "guidon-optimizer"
version = "0.1.0"
description = "Training-progress-neutral blockwise guidance for AdamW"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
jax = ["jax==0.6.2", "optax==0.2.5"]
tpu = ["jax[tpu]==0.6.2", "optax==0.2.5"]
data = [
    "cryptography==45.0.6",
    "datasketch==1.6.5",
    "huggingface-hub==0.34.4",
    "pyarrow==19.0.1",
    "safetensors==0.6.2",
    "tldextract==5.3.0",
    "tokenizers==0.21.4",
]
parity = ["torch==2.8.0", "transformers==4.55.4"]
dev = [
    "matplotlib>=3.10,<4",
    "pytest>=8,<9",
    "ruff>=0.11,<0.12",
    "scipy>=1.14,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/guidon"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
